services:
  postgres:
    image: postgres:16
    container_name: journeytogether-postgres
    environment:
      POSTGRES_DB: journeytogether
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d journeytogether"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - journeytogether
  liquibase:
    build:
      context: ./migrations
      dockerfile: Dockerfile
    command: --url=jdbc:postgresql://journeytogether-postgres:5432/journeytogether --username=postgres --password=postgres --changelog-file=db/master.yaml update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - journeytogether
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      liquibase:
        condition: service_completed_successfully
    networks:
      - journeytogether

networks:
  journeytogether:
